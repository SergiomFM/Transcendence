<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" ry="7" fill="#1c1510"/>
  
  <!-- Outer glow -->
  <circle cx="16" cy="17" r="9" fill="#b45309" opacity="0.2"/>
  <circle cx="16" cy="17" r="7" fill="#d97706" opacity="0.25"/>
  
  <!-- Magic orb core -->
  <circle cx="16" cy="17" r="5" fill="#f59e0b"/>
  <circle cx="16" cy="17" r="3.5" fill="#fbbf24"/>
  <circle cx="15" cy="16" r="1.5" fill="#fde68a"/>
  
  <!-- Pixel sparkles (8-bit feel) -->
  <!-- Top spark -->
  <rect x="15" y="6" width="2" height="2" fill="#fbbf24"/>
  <rect x="15" y="4" width="2" height="2" fill="#f59e0b" opacity="0.6"/>
  
  <!-- Top-right spark -->
  <rect x="23" y="11" width="2" height="2" fill="#fbbf24"/>
  <rect x="25" y="9" width="2" height="2" fill="#f59e0b" opacity="0.5"/>
  
  <!-- Top-left spark -->
  <rect x="7" y="11" width="2" height="2" fill="#fbbf24"/>
  <rect x="5" y="9" width="2" height="2" fill="#f59e0b" opacity="0.5"/>
  
  <!-- Bottom-right spark -->
  <rect x="22" y="21" width="2" height="2" fill="#d97706" opacity="0.7"/>
  
  <!-- Bottom-left spark -->
  <rect x="8" y="21" width="2" height="2" fill="#d97706" opacity="0.7"/>
  
  <!-- Small pixel dots around orb -->
  <rect x="12" y="9" width="1" height="1" fill="#fde68a" opacity="0.8"/>
  <rect x="20" y="14" width="1" height="1" fill="#fde68a" opacity="0.8"/>
  <rect x="10" y="19" width="1" height="1" fill="#fde68a" opacity="0.6"/>
  <rect x="21" y="23" width="1" height="1" fill="#fde68a" opacity="0.5"/>
  <rect x="19" y="8" width="1" height="1" fill="#fde68a" opacity="0.7"/>
  
  <!-- Hand/claw silhouette below orb (wizard casting) -->
  <path d="M12 24 L11 27 L12 28 L14 26 L14 28 L15 29 L16 27 L17 29 L18 28 L18 26 L20 28 L21 27 L20 24" 
        fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
