<!DOCTYPE html>
<html>
<head>
  <title>Auth Test</title>
</head>
<body>

<h2>Register</h2>
<form action="http://localhost:3000/auth/register" method="POST">
  <input name="username" placeholder="username"><br>
  <input name="email" placeholder="email"><br>
  <input name="alias" placeholder="alias"><br>
  <input name="password" type="password" placeholder="password"><br>
  <button>Register</button>
</form>

<h2>Login</h2>
<form action="http://localhost:3000/auth/login" method="POST">
  <input name="identifier" placeholder="email or username"><br>
  <input name="password" type="password"><br>
  <button>Login</button>
</form>

<h2>2FA Setup</h2>
<form action="http://localhost:3000/auth/2fa/setup" method="POST">
  <button>Setup 2FA</button>
</form>

<h2>2FA Confirm</h2>
<form action="http://localhost:3000/auth/2fa/confirm" method="POST">
  <input name="token" placeholder="123456"><br>
  <button>Confirm</button>
</form>

<h2>2FA Verify (login)</h2>
<form action="http://localhost:3000/auth/2fa/verify" method="POST">
  <input name="token" placeholder="123456"><br>
  <button>Verify</button>
</form>

<h2>Dashboard</h2>
<a href="http://localhost:3000/dashboard" target="_blank">Open dashboard</a>

</body>
</html>
