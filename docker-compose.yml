services:
  proxy:
    image: ghcr.io/pvcordeiro/transcendence-proxy
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - frontend
      - users
      - game
      - chat
    profiles:
      - prod

  proxy-dev:
    image: nginx:1.27-alpine
    command: sh -c "apk add --no-cache openssl && mkdir -p /etc/nginx/ssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/selfsigned.key -out /etc/nginx/ssl/selfsigned.crt -subj '/CN=localhost' && nginx -g 'daemon off;'"
    ports:
      - "3000:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-dev
      - users-dev
      - game-dev
      - chat-dev
    profiles:
      - dev

  frontend:
    image: ghcr.io/pvcordeiro/transcendence-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: https://42.pvcordeiro.dev
    profiles:
      - prod

  frontend-dev:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: https://localhost:3000
    volumes:
      - ./frontend:/app:cached
      - ./shared:/app/shared:cached
    profiles:
      - dev

  users:
    image: ghcr.io/pvcordeiro/transcendence-users
    build:
      context: .
      dockerfile: users/Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://42.pvcordeiro.dev
      GOOGLE_CALLBACK_URL: https://42.pvcordeiro.dev/api/users/auth/google/callback
      CHAT_BACKEND_URL: http://chat:3000
    env_file:
      - users/.env
    volumes:
      - ./users/database:/app/database
    profiles:
      - prod

  users-dev:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "(apt-get update && apt-get install -y --no-install-recommends python3 openssl make g++ && rm -rf /var/lib/apt/lists/* && bun install && openssl rand 32 > /app/database/secret-key) && bun run start"
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      FRONTEND_URL: https://localhost:3000
      GOOGLE_CALLBACK_URL: https://localhost:3000/api/users/auth/google/callback
      CHAT_BACKEND_URL: http://chat-dev:3000
    env_file:
      - users/.env
    volumes:
      - ./users:/app:cached
    profiles:
      - dev

  chat:
    image: ghcr.io/pvcordeiro/transcendence-chat
    build:
      context: .
      dockerfile: chat/Dockerfile
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:./data/dev.db
      USERS_SERVICE_URL: http://users:3000
    volumes:
      - ./chat/data:/app/data
    profiles:
      - prod

  chat-dev:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run prisma generate && bun run prisma db push && bun run index.ts"
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: file:./data/dev.db
      USERS_SERVICE_URL: http://users-dev:3000
    volumes:
      - ./chat:/app:cached
    profiles:
      - dev

  game:
    image: ghcr.io/pvcordeiro/transcendence-game
    build:
      context: .
      dockerfile: game/Dockerfile
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      USERS_BACKEND_URL: http://users:3000
      FRONTEND_URL: https://42.pvcordeiro.dev
    profiles:
      - prod

  game-dev:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      USERS_BACKEND_URL: http://users-dev:3000
      FRONTEND_URL: https://localhost:3000
    volumes:
      - ./game:/app:cached
      - ./shared:/app/shared:cached
      - ./frontend/public/models:/app/public/models
    profiles:
      - dev
