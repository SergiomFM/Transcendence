services:
    frontend:
        build:
            context: frontend/frontend-fr-fr
        ports:
            - "3000:3000"

    users:
        build:
            context: users
        ports:
            - "3001:3001"

    game:
        build:
            context: game
        ports:
            - "3002:3002"

    minio:
        image: minio/minio:latest
        command: server /storage --console-address ":9001" --address ":9000"
        volumes:
            - "./minio:/storage/:rw"
        environment:
            - MINIO_ROOT_USER=woiefghwenlkfgbouerwjfn
            - MINIO_ROOT_PASSWORD=1p39rodufjeqnpwdglirekjgnp
            - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
            - MINIO_SERVER_URL=http://localhost:9000
        ports:
            - "9001:9001"
            - "9000:9000"