services:
  frontend:
    build:
      context: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    profiles:
      - prod

  users:
    build:
      context: users
    ports:
      - "3001:3001"
    profiles:
      - prod

  game:
    build:
      context: game
    ports:
      - "3002:3002"
    profiles:
      - prod

  frontend-dev:
    image: oven/bun:latest
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
    volumes:
      - ./frontend:/app:cached
      - ./shared:/app/shared:cached
      - frontend_node_modules:/app/node_modules
    profiles:
      - dev

  users-dev:
    image: oven/bun:latest
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./users:/app:cached
      - users_node_modules:/app/node_modules
    profiles:
      - dev

  game-dev:
    image: oven/bun:latest
    working_dir: /app
    command: sh -c "bun install && bun run dev"
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./game:/app:cached
      - ./shared:/app/shared:cached
      - ./frontend/public/models:/app/public/models
      - game_node_modules:/app/node_modules
    profiles:
      - dev

volumes:
  frontend_node_modules:
  users_node_modules:
  game_node_modules:
